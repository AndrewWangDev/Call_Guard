name: Bug Report
description: Report a reproducible defect or unexpected behavior in Compose Call Guard.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        *Note: This repository is archived. Bug reports serve as known-issue tracking for the community.*
  - type: input
    id: device-info
    attributes:
      label: Device & OS Version
      description: e.g. Google Pixel 7, Android 14 (API 34)
      placeholder: Device model and Android version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Clear, numbered steps to reproduce the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior & Logs
      description: What actually occurred? Include logcat or error messages if available.
    validations:
      required: false
